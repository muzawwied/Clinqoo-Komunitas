<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Analitik Kreator — Komunitas Clincoo</title>
    <meta name="description" content="Statistik kontenmu di Komunitas Clincoo.">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .ic { width: 1.25em; height: 1.25em; display: inline-block; vertical-align: middle; flex-shrink: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-white min-h-screen text-slate-900 antialiased selection:bg-slate-200 selection:text-slate-900">

    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-sm border-b border-slate-200 px-4 py-3 transition-all">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <a href="akun.html" class="flex items-center text-slate-900 hover:opacity-70 transition-opacity w-8">
                <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </a>
            <h1 class="text-[15px] font-bold text-slate-900 tracking-tight flex items-center gap-1">
                Analitik Kreator
            </h1>
            <div class="w-8"></div>
        </div>
    </header>

    <main class="max-w-md mx-auto pt-4 pb-24">
        
        <!-- Header Subtitle -->
        <section class="px-4 pb-3">
            <h2 class="text-xl font-bold text-slate-900 tracking-tight">Performa Konten</h2>
            <p class="text-[13px] text-slate-500 mt-0.5">Statistik postingan kamu, diperbarui real-time dari linimasa.</p>
        </section>

        <div class="h-px w-full bg-slate-200 my-1"></div>

        <section class="px-4 py-5 grid grid-cols-2 gap-y-5 gap-x-6">
            <div>
                <p class="text-[12px] font-medium text-slate-500 uppercase tracking-wider">Total Postingan</p>
                <p id="an-posts" class="text-2xl font-bold text-slate-900 mt-1">0</p>
            </div>
            <div>
                <p class="text-[12px] font-medium text-slate-500 uppercase tracking-wider">Suka Diterima</p>
                <p id="an-likes" class="text-2xl font-bold text-slate-900 mt-1">0</p>
            </div>
            <div>
                <p class="text-[12px] font-medium text-slate-500 uppercase tracking-wider">Komentar Diterima</p>
                <p id="an-cmts" class="text-2xl font-bold text-slate-900 mt-1">0</p>
            </div>
            <div>
                <p class="text-[12px] font-medium text-slate-500 uppercase tracking-wider">Rata-rata Interaksi</p>
                <p id="an-eng" class="text-2xl font-bold text-slate-900 mt-1">0</p>
            </div>
        </section>

        <div class="h-px w-full bg-slate-200 my-1"></div>

        <section class="px-4 py-5">
            <div class="flex items-center gap-2 mb-3">
                <svg class="ic text-slate-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                <h3 class="text-[15px] font-semibold text-slate-900">Postingan Terpopuler</h3>
            </div>
            <div id="an-top" class="text-[14px] text-slate-500">
                …
            </div>
        </section>

        <div class="h-px w-full bg-slate-200 my-1"></div>

        <section class="px-4 py-5">
            <div class="flex items-center gap-2 mb-4">
                <svg class="ic text-slate-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
                <h3 class="text-[15px] font-semibold text-slate-900">Suka per Postingan Terbaru</h3>
            </div>
            <div class="pt-2 pb-1">
                <div id="an-chart" class="flex items-end space-x-2 h-36 border-b border-slate-200 pb-1"></div>
                <div id="an-chart-labels" class="flex items-center space-x-2 mt-2"></div>
            </div>
        </section>

        <div class="h-px w-full bg-slate-200 my-1"></div>

        <section class="px-4 py-5">
            <div class="flex items-center gap-2 mb-4">
                <svg class="ic text-slate-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></svg>
                <h3 class="text-[15px] font-semibold text-slate-900">Topik & Tag Digunakan</h3>
            </div>
            <div id="an-tags" class="space-y-3.5"></div>
        </section>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-xl z-50 opacity-0 transition-opacity duration-300 pointer-events-none max-w-[90vw] text-center"></div>

    <script src="assets/demo.js"></script>
    <script>
        var API = '/api';
        if (location.hostname.indexOf('github.io') !== -1) API = 'https://clincoo-komunitas.pages.dev/api';
        
        function safeRedirect(url) {
            try {
                if (location.protocol === 'blob:' || location.href.indexOf('usercontent.goog') !== -1 || !location.hostname) {
                    console.warn('Redirect dilewati di lingkungan preview:', url);
                    return;
                }
                location.replace(url);
            } catch (e) {
                console.warn('Kesalahan navigasi dicegah:', e);
            }
        }

        function token() { try { return localStorage.getItem('clincoo_auth_token') || localStorage.getItem('clincoo_token') || ''; } catch (e) { return ''; } }
        
        function api(path, opts) {
            if (window.DemoApi && !token()) return window.DemoApi(path, opts);
            opts = opts || {};
            opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
            var tk = token(); if (tk) opts.headers['Authorization'] = 'Bearer ' + tk;
            return fetch(API + path, opts).then(function (r) {
                return r.json().catch(function () { return {}; }).then(function (d) { d._status = r.status; return d; });
            }).catch(function() {
                if (path.indexOf('/community') === 0) return {
                    feed: [
                        { mine: true, likes: 64, comment_count: 18, content: "Pentingnya menjaga kesehatan mental dan gaya hidup seimbang di era digital. #kesehatan #mindfulness #tips" },
                        { mine: true, likes: 42, comment_count: 9, content: "5 Makanan kaya nutrisi yang wajib ada di piring kamu setiap hari! #nutrisi #sehat #tips" },
                        { mine: true, likes: 28, comment_count: 5, content: "Rutin jalan kaki 30 menit sehari bisa mengubah kesehatan jantungmu secara drastis. #olahraga #sehat" },
                        { mine: true, likes: 19, comment_count: 3, content: "Tips minum air putih yang cukup dan teratur selama aktivitas padat. #kesehatan #tips" }
                    ]
                };
                return {};
            });
        }

        function toast(msg) {
            var t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg; t.classList.remove('opacity-0');
            clearTimeout(t._tm); t._tm = setTimeout(function () { t.classList.add('opacity-0'); }, 2200);
        }

        function esc(t) { return String(t || '').replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        
        function guard() { 
            if (!token() && !window.DemoApi) { 
                if (location.protocol === 'blob:' || location.href.indexOf('usercontent.goog') !== -1) return true;
                safeRedirect('login.html'); 
                return false; 
            } 
            return true; 
        }

        function init() {
            api('/community?limit=100').then(function (d) {
                var mine = (d.feed || []).filter(function (p) { return p.mine; });
                var likes = mine.reduce(function (a, p) { return a + (p.likes || 0); }, 0);
                var cmts = mine.reduce(function (a, p) { return a + (p.comment_count || 0); }, 0);
                
                document.getElementById('an-posts').textContent = mine.length;
                document.getElementById('an-likes').textContent = likes;
                document.getElementById('an-cmts').textContent = cmts;
                document.getElementById('an-eng').textContent = mine.length ? ((likes + cmts) / mine.length).toFixed(1) : '0';

                // Render Postingan Terpopuler
                var topEl = document.getElementById('an-top');
                if (!mine.length) { 
                    topEl.textContent = 'Belum ada postingan — buat postingan pertamamu di beranda!'; 
                } else {
                    var top = mine.slice().sort(function (a, b) { return ((b.likes||0)+(b.comment_count||0)) - ((a.likes||0)+(a.comment_count||0)); })[0];
                    var txt = esc(top.content || top.text || '').slice(0, 140);
                    topEl.innerHTML = '<p class="text-[14px] text-slate-800 leading-relaxed font-normal">' + txt + (txt.length >= 140 ? '…' : '') + '</p>'
                        + '<div class="flex items-center gap-4 mt-3 text-[13px] text-slate-500 font-medium"><span class="flex items-center gap-1.5"><svg class="ic text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>' + (top.likes||0) + ' Suka</span><span class="flex items-center gap-1.5"><svg class="ic text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>' + (top.comment_count||0) + ' Komentar</span></div>';
                }

                // Render Grafik Suka (Bar Chart Flat Minimalis)
                var recent = mine.slice(0, 7).reverse();
                var chart = document.getElementById('an-chart');
                var labels = document.getElementById('an-chart-labels');
                if (!recent.length) { 
                    chart.innerHTML = '<p class="text-[13px] text-slate-400 self-center w-full text-center py-6">Belum ada data grafik.</p>'; 
                    labels.innerHTML = ''; 
                } else {
                    var maxL = Math.max.apply(null, recent.map(function (p) { return p.likes || 0; }).concat([1]));
                    chart.innerHTML = recent.map(function (p) {
                        var h = Math.max(8, Math.round(((p.likes || 0) / maxL) * 100));
                        return '<div class="flex-1 bg-slate-900 hover:bg-slate-700 transition-all rounded-t-sm relative group" style="height:' + h + '%">'
                            + '<div class="absolute -top-7 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[10px] py-0.5 px-1.5 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">' + (p.likes || 0) + '</div>'
                            + '</div>';
                    }).join('');
                    labels.innerHTML = recent.map(function (p, i) { 
                        return '<span class="flex-1 text-center text-[11px] text-slate-400 truncate">Post #' + (i + 1) + '</span>'; 
                    }).join('');
                }

                // Render Tag Terpakai (Progress Bar Tipis)
                var tags = {}, order = [];
                mine.forEach(function (p) {
                    (String(p.content || p.text || '').match(/#[\w]+/g) || []).forEach(function (t) {
                        if (!tags[t]) order.push(t); 
                        tags[t] = (tags[t] || 0) + 1;
                    });
                });
                var tg = document.getElementById('an-tags');
                if (!order.length) { 
                    tg.innerHTML = '<p class="text-[13px] text-slate-400">Belum ada hashtag di postinganmu.</p>'; 
                } else {
                    var maxT = Math.max.apply(null, order.map(function (t) { return tags[t]; }));
                    tg.innerHTML = order.slice(0, 6).map(function (t) {
                        var w = Math.max(10, Math.round((tags[t] / maxT) * 100));
                        return '<div><div class="flex justify-between text-[13px] mb-1.5"><span class="font-medium text-slate-800">' + esc(t) + '</span><span class="text-slate-400 text-xs">' + tags[t] + ' postingan</span></div><div class="h-1.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-slate-900 rounded-full" style="width:' + w + '%"></div></div></div>';
                    }).join('');
                }
            }).catch(function () { toast('Gagal memuat data analitik'); });
        }

        if (guard()) init();
    </script>
</body>
</html>
