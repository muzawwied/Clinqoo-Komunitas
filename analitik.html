<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Analitik Kreator — Komunitas Clincoo</title>
    <meta name="description" content="Statistik kontenmu di Komunitas Clincoo.">
    <link rel="stylesheet" href="tailwind.css">
    <style>.ic{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;flex:none}.ic-fill{fill:currentColor}</style>
    <style>.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}</style>
</head>
<body class="bg-gray-50 h-screen overflow-y-auto no-scrollbar font-sans text-gray-800">
    <header class="bg-white/95 backdrop-blur-sm border-b border-gray-100 py-3 px-4 fixed top-0 w-full z-20">
        <div class="flex justify-between items-center max-w-2xl mx-auto">
            <a href="index.html" class="flex items-center space-x-2 text-gray-900 font-bold text-[15px] hover:opacity-70 transition">
                <svg class="ic text-xl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><span>Analitik Kreator</span>
            </a>
        </div>
    </header>
    <main class="max-w-2xl mx-auto pt-16 pb-32">
        <div class="px-4 py-4">
            <h1 class="text-xl font-bold text-gray-900">Analitik Kreator</h1>
            <p class="text-[13px] text-gray-500">Statistik kontenmu, diperbarui real-time dari linimasa.</p>
        </div>
        <!-- Ringkasan -->
        <div class="grid grid-cols-2 gap-2 px-4">
            <div class="bg-white rounded-2xl border border-gray-100 p-4 shadow-sm">
                <p id="an-posts" class="text-2xl font-bold text-gray-900">0</p>
                <p class="text-[12px] text-gray-500">Total postingan</p>
            </div>
            <div class="bg-white rounded-2xl border border-gray-100 p-4 shadow-sm">
                <p id="an-likes" class="text-2xl font-bold text-gray-900">0</p>
                <p class="text-[12px] text-gray-500">Suka diterima</p>
            </div>
            <div class="bg-white rounded-2xl border border-gray-100 p-4 shadow-sm">
                <p id="an-cmts" class="text-2xl font-bold text-gray-900">0</p>
                <p class="text-[12px] text-gray-500">Komentar diterima</p>
            </div>
            <div class="bg-white rounded-2xl border border-gray-100 p-4 shadow-sm">
                <p id="an-eng" class="text-2xl font-bold text-gray-900">0</p>
                <p class="text-[12px] text-gray-500">Rata-rata interaksi / postingan</p>
            </div>
        </div>
        <!-- Top postingan -->
        <div class="bg-white mt-3 mx-4 rounded-2xl border border-gray-100 p-4 shadow-sm">
            <h3 class="text-[13px] font-semibold text-gray-600 mb-3 flex items-center space-x-1.5"><svg class="ic text-base text-yellow-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7z"/><path d="M5 20h14"/></svg><span>Postingan terpopuler</span></h3>
            <div id="an-top" class="text-[14px] text-gray-500">…</div>
        </div>
        <!-- Grafik suka per postingan -->
        <div class="bg-white mt-3 mx-4 rounded-2xl border border-gray-100 p-4 shadow-sm">
            <h3 class="text-[13px] font-semibold text-gray-600 mb-3 flex items-center space-x-1.5"><svg class="ic text-base text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg><span>Suka per postingan (terbaru)</span></h3>
            <div id="an-chart" class="flex items-end space-x-1.5 h-32"></div>
            <div id="an-chart-labels" class="flex items-center space-x-1.5 mt-1.5"></div>
        </div>
        <!-- Tag terpakai -->
        <div class="bg-white mt-3 mx-4 rounded-2xl border border-gray-100 p-4 shadow-sm mb-4">
            <h3 class="text-[13px] font-semibold text-gray-600 mb-3 flex items-center space-x-1.5"><svg class="ic text-base text-purple-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></svg><span>Tag yang kamu pakai</span></h3>
            <div id="an-tags" class="space-y-2"></div>
        </div>
    </main>
    <script>
        function init() {
            api('/community?limit=100').then(function (d) {
                var mine = (d.feed || []).filter(function (p) { return p.mine; });
                var likes = mine.reduce(function (a, p) { return a + (p.likes || 0); }, 0);
                var cmts = mine.reduce(function (a, p) { return a + (p.comment_count || 0); }, 0);
                document.getElementById('an-posts').textContent = mine.length;
                document.getElementById('an-likes').textContent = likes;
                document.getElementById('an-cmts').textContent = cmts;
                document.getElementById('an-eng').textContent = mine.length ? ((likes + cmts) / mine.length).toFixed(1) : '0';
                // top postingan
                var topEl = document.getElementById('an-top');
                if (!mine.length) { topEl.textContent = 'Belum ada postingan — buat postingan pertamamu di beranda!'; }
                else {
                    var top = mine.slice().sort(function (a, b) { return ((b.likes||0)+(b.comment_count||0)) - ((a.likes||0)+(a.comment_count||0)); })[0];
                    var txt = esc(top.content || top.text || '').slice(0, 120);
                    topEl.innerHTML = '<p class="text-[14px] text-gray-800 leading-relaxed">' + txt + '…</p>'
                        + '<div class="flex items-center space-x-4 mt-2 text-[12px] text-gray-500"><span class="flex items-center space-x-1"><svg class="ic text-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>' + (top.likes||0) + '</span><span class="flex items-center space-x-1"><svg class="ic text-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>' + (top.comment_count||0) + '</span></div>';
                }
                // grafik batang (7 terbaru)
                var recent = mine.slice(0, 7).reverse();
                var chart = document.getElementById('an-chart');
                var labels = document.getElementById('an-chart-labels');
                if (!recent.length) { chart.innerHTML = '<p class="text-[13px] text-gray-400 self-center">Belum ada data grafik.</p>'; labels.innerHTML = ''; }
                else {
                    var maxL = Math.max.apply(null, recent.map(function (p) { return p.likes || 0; }).concat([1]));
                    chart.innerHTML = recent.map(function (p, i) {
                        var h = Math.max(4, Math.round(((p.likes || 0) / maxL) * 100));
                        return '<div class="flex-1 bg-blue-500 rounded-t-md hover:bg-blue-600 transition-all" style="height:' + h + '%" title="' + (p.likes || 0) + ' suka"></div>';
                    }).join('');
                    labels.innerHTML = recent.map(function (p, i) { return '<span class="flex-1 text-center text-[10px] text-gray-400 truncate">#' + (i + 1) + '</span>'; }).join('');
                }
                // tag terpakai
                var tags = {}, order = [];
                mine.forEach(function (p) {
                    (String(p.content || p.text || '').match(/#[\w]+/g) || []).forEach(function (t) {
                        if (!tags[t]) order.push(t); tags[t] = (tags[t] || 0) + 1;
                    });
                });
                var tg = document.getElementById('an-tags');
                if (!order.length) { tg.innerHTML = '<p class="text-[13px] text-gray-400">Belum ada #tag di postinganmu. Pakai #tag biar postinganmu gampang ditemukan!</p>'; }
                else {
                    var maxT = Math.max.apply(null, order.map(function (t) { return tags[t]; }));
                    tg.innerHTML = order.slice(0, 8).map(function (t) {
                        var w = Math.max(12, Math.round((tags[t] / maxT) * 100));
                        return '<div><div class="flex justify-between text-[12px] mb-1"><span class="font-semibold text-gray-700">' + esc(t) + '</span><span class="text-gray-400">' + tags[t] + 'x</span></div><div class="h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-purple-500 rounded-full" style="width:' + w + '%"></div></div></div>';
                    }).join('');
                }
            }).catch(function () { toast('Koneksi bermasalah'); });
        }
    </script>
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm font-medium px-4 py-2.5 rounded-full shadow-lg z-50 opacity-0 transition-opacity duration-300 pointer-events-none max-w-[90vw] text-center"></div>
        <script src="assets/demo.js"></script>
<script>
        var API = '/api';
        if (location.hostname.indexOf('github.io') !== -1) API = 'https://clincoo-komunitas.pages.dev/api';
        function token() { try { return localStorage.getItem('clincoo_auth_token') || localStorage.getItem('clincoo_token') || ''; } catch (e) { return ''; } }
        function api(path, opts) {
            if (window.DemoApi && !token()) return window.DemoApi(path, opts);
            opts = opts || {};
            opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
            var tk = token(); if (tk) opts.headers['Authorization'] = 'Bearer ' + tk;
            return fetch(API + path, opts).then(function (r) {
                return r.json().catch(function () { return {}; }).then(function (d) { d._status = r.status; return d; });
            });
        }
        function toast(msg) { return; /* toast dimatikan sesuai permintaan */
            var t = document.getElementById('toast');
            t.textContent = msg; t.classList.remove('opacity-0');
            clearTimeout(t._tm); t._tm = setTimeout(function () { t.classList.add('opacity-0'); }, 2200);
        }
        function esc(t) { return String(t || '').replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        function slugOf(name) { return '@' + String(name || 'user').toLowerCase().replace(/[^a-z0-9]+/g, ''); }
        function guard() { if (!token() && !window.DemoApi) { location.replace('login.html'); return false; } return true; }
        function logoutNow() {
            api('/auth/logout', { method: 'POST' }).catch(function () {});
            try { localStorage.removeItem('clincoo_auth_token'); localStorage.removeItem('clincoo_token'); localStorage.removeItem('clincoo_community_me'); } catch (e) {}
            location.replace('login.html');
        }
        if (guard()) init();
    </script>
</body>
</html>
