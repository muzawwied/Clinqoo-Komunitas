<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tersimpan — Komunitas Clinqoo</title>
    <meta name="description" content="Postingan yang kamu simpan di Komunitas Clinqoo.">
    <link rel="stylesheet" href="tailwind.css">
    <style>.ic{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;flex:none}.ic-fill{fill:currentColor}</style>
    <style>.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}</style>
</head>
<body class="bg-gray-50 h-screen overflow-y-auto no-scrollbar font-sans text-gray-800">
    <header class="bg-white/95 backdrop-blur-sm border-b border-gray-100 py-3 px-4 fixed top-0 w-full z-20">
        <div class="flex justify-between items-center max-w-2xl mx-auto">
            <a href="index.html" class="flex items-center space-x-2 text-gray-900 font-bold text-[15px] hover:opacity-70 transition">
                <svg class="ic text-xl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><span>Tersimpan</span>
            </a>
        </div>
    </header>
    <main class="max-w-2xl mx-auto pt-16 pb-32">
        <div class="flex items-center justify-between px-4 py-4">
            <div>
                <h1 class="text-xl font-bold text-gray-900">Tersimpan</h1>
                <p id="sv-count" class="text-[13px] text-gray-500">Memuat…</p>
            </div>
            <svg class="ic text-2xl text-gray-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
        </div>
        <div id="sv-list" class="px-4 space-y-3"></div>
    </main>
    <script>
        function loadSaved() { try { return JSON.parse(localStorage.getItem('clinqoo_saved') || '[]'); } catch (e) { return []; } }
        function init() {
            var saved = loadSaved();
            var list = document.getElementById('sv-list');
            document.getElementById('sv-count').textContent = saved.length + ' postingan tersimpan';
            if (!saved.length) {
                list.innerHTML = '<div class="flex flex-col items-center justify-center py-16 px-4 text-center bg-white rounded-2xl border border-gray-100 mt-2"><div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mb-4"><svg class="ic text-3xl text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg></div><h3 class="text-lg font-bold text-gray-900 mb-1">Belum ada yang disimpan</h3><p class="text-[14px] text-gray-500 max-w-[260px]">Tap ikon bookmark 🔖 di postingan untuk menyimpannya di sini.</p></div>';
                return;
            }
            api('/community?limit=100').then(function (d) {
                var fresh = {};
                (d.feed || []).forEach(function (p) { fresh[p.id] = p; });
                list.innerHTML = saved.map(function (sv) {
                    var p = fresh[sv.id] || sv;
                    var photo = p.photo || p.author_avatar || '';
                    var ava = photo
                        ? '<img src="' + esc(photo) + '" class="w-full h-full object-cover" alt="">'
                        : esc((p.author || 'U').charAt(0));
                    var txt = esc(p.content || p.text || '');
                    txt = txt.replace(/#[\w]+/g, function (t) { return '<span class="text-blue-600">' + t + '</span>'; });
                    return '<div class="bg-white rounded-2xl border border-gray-100 p-4 shadow-sm">'
                        + '<div class="flex items-start space-x-3">'
                        + '<div class="w-10 h-10 rounded-full flex-shrink-0 bg-gradient-to-br from-blue-400 to-purple-500 flex items-center justify-center font-bold text-white text-xs overflow-hidden">' + ava + '</div>'
                        + '<div class="flex-1 min-w-0">'
                        + '<p class="font-bold text-[14px] text-gray-900">' + esc(p.author || sv.author) + ' <span class="text-gray-400 font-normal text-[12px]">· ' + esc(p.time || sv.time || '') + '</span></p>'
                        + (p.image ? (String(p.image).indexOf('data:video/') === 0 ? '<video src="' + esc(p.image) + '" class="mt-2 rounded-xl border border-gray-100 w-full max-h-64" controls playsinline preload="metadata"></video>' : '<img src="' + esc(p.image) + '" class="mt-2 rounded-xl border border-gray-100 max-h-64 w-full object-cover" alt="">') : '')
                        + '<p class="text-[14px] text-gray-700 mt-1 leading-relaxed whitespace-pre-wrap">' + txt + '</p>'
                        + '<div class="flex items-center space-x-4 mt-2 text-[12px] text-gray-500">'
                        + '<span class="flex items-center space-x-1"><svg class="ic text-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>' + (p.likes || 0) + '</span>'
                        + '<span class="flex items-center space-x-1"><svg class="ic text-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>' + (p.comment_count || 0) + '</span>'
                        + '</div></div>'
                        + '<button onclick="unsave(\'' + esc(sv.id) + '\')" class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded-full hover:bg-red-50 text-gray-400 hover:text-red-500 transition-colors"><svg class="ic text-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>'
                        + '</div></div>';
                }).join('');
            }).catch(function () { toast('Koneksi bermasalah — menampilkan salinan tersimpan'); });
        }
        function unsave(id) {
            var saved = loadSaved().filter(function (x) { return x.id !== id; });
            try { localStorage.setItem('clinqoo_saved', JSON.stringify(saved)); } catch (e) {}
            toast('Dihapus dari Tersimpan');
            init();
        }
    </script>
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm font-medium px-4 py-2.5 rounded-full shadow-lg z-50 opacity-0 transition-opacity duration-300 pointer-events-none max-w-[90vw] text-center"></div>
        <script src="assets/demo.js"></script>
<script>
        var API = '/api';
        if (location.hostname.indexOf('github.io') !== -1) API = 'https://clincoo-komunitas.pages.dev/api';
        function token() { try { return localStorage.getItem('clinqoo_auth_token') || localStorage.getItem('clinqoo_token') || ''; } catch (e) { return ''; } }
        function api(path, opts) {
            if (window.DemoApi && !token()) return window.DemoApi(path, opts);
            opts = opts || {};
            opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
            var tk = token(); if (tk) opts.headers['Authorization'] = 'Bearer ' + tk;
            return fetch(API + path, opts).then(function (r) {
                return r.json().catch(function () { return {}; }).then(function (d) { d._status = r.status; return d; });
            });
        }
        function toast(msg) { return; /* toast dimatikan sesuai permintaan */
            var t = document.getElementById('toast');
            t.textContent = msg; t.classList.remove('opacity-0');
            clearTimeout(t._tm); t._tm = setTimeout(function () { t.classList.add('opacity-0'); }, 2200);
        }
        function esc(t) { return String(t || '').replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        function slugOf(name) { return '@' + String(name || 'user').toLowerCase().replace(/[^a-z0-9]+/g, ''); }
        function guard() { if (!token() && !window.DemoApi) { location.replace('login.html'); return false; } return true; }
        function logoutNow() {
            api('/auth/logout', { method: 'POST' }).catch(function () {});
            try { localStorage.removeItem('clinqoo_auth_token'); localStorage.removeItem('clinqoo_token'); localStorage.removeItem('clinqoo_community_me'); } catch (e) {}
            location.replace('login.html');
        }
        if (guard()) init();
    </script>
</body>
</html>
