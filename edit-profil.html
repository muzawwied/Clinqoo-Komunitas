<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edit Profil — Komunitas Clincoo</title>
    <meta name="description" content="Edit profil Komunitas Clincoo: foto, nama, bio, dan tautan.">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-white min-h-screen text-slate-900 antialiased selection:bg-slate-200 selection:text-slate-900 overflow-y-auto no-scrollbar">

    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-sm border-b border-slate-200 px-4 py-3 transition-all">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <a href="akun.html" class="flex-1 flex items-center text-slate-900 hover:opacity-70 transition-opacity">
                <svg class="w-6 h-6 -ml-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </a>
            <h1 class="text-[15px] font-bold text-slate-900 tracking-tight flex-1 text-center">
                Edit Profil
            </h1>
            <div class="flex-1 flex justify-end">
                <button id="save-btn" onclick="saveProfile()" class="text-[15px] font-bold text-blue-600 hover:text-blue-700 hover:opacity-80 transition disabled:opacity-50">Simpan</button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto pt-6 pb-32">
        <!-- Foto profil (Tengah, Bersih tanpa border tebal) -->
        <div class="flex flex-col items-center mb-8 px-4">
            <div class="relative cursor-pointer group" onclick="document.getElementById('ava-file').click()">
                <div class="w-24 h-24 rounded-full bg-slate-100 border border-slate-200 overflow-hidden flex items-center justify-center transition-opacity hover:opacity-90">
                    <span id="ava-initial" class="text-3xl font-medium text-slate-500">?</span>
                    <img id="ava-img" src="" alt="Foto profil" class="w-full h-full object-cover hidden">
                </div>
            </div>
            <button onclick="document.getElementById('ava-file').click()" class="mt-3 text-blue-600 text-[14px] font-medium hover:underline transition">Ubah foto profil</button>
            <input type="file" id="ava-file" accept="image/*" class="hidden" onchange="handleAvaFile(this)">
        </div>

        <!-- Form Fields (Flat list design tanpa card) -->
        <div class="px-4 space-y-5">
            
            <!-- Input Nama -->
            <div class="border-b border-slate-200 pb-2 flex items-start">
                <label class="w-24 flex-shrink-0 pt-0.5 text-[15px] text-slate-900">Nama</label>
                <input id="f-name" type="text" maxlength="40" placeholder="Nama tampilan kamu" class="w-full bg-transparent text-[15px] text-slate-900 focus:outline-none placeholder-slate-400">
            </div>

            <!-- Input Bio -->
            <div class="border-b border-slate-200 pb-2 flex items-start">
                <label class="w-24 flex-shrink-0 pt-0.5 text-[15px] text-slate-900">Bio</label>
                <div class="w-full">
                    <textarea id="f-bio" maxlength="200" rows="3" placeholder="Ceritakan tentang diri kamu..." class="w-full bg-transparent text-[15px] text-slate-900 resize-none focus:outline-none placeholder-slate-400 leading-relaxed"></textarea>
                    <div class="text-right mt-1"><span id="bio-count" class="text-[12px] text-slate-400">0 / 200</span></div>
                </div>
            </div>

            <!-- Input Tautan -->
            <div class="border-b border-slate-200 pb-2 flex items-start">
                <label class="w-24 flex-shrink-0 pt-0.5 text-[15px] text-slate-900">Tautan</label>
                <input id="f-link" type="url" maxlength="120" placeholder="situsmu.com" class="w-full bg-transparent text-[15px] text-slate-900 focus:outline-none placeholder-slate-400">
            </div>
            
        </div>

        <!-- Info Tambahan / Pribadi -->
        <div class="px-4 mt-8">
            <h3 class="text-[14px] font-semibold text-slate-900 mb-4">Informasi pribadi</h3>
            <div class="border-b border-slate-200 pb-3 flex items-center justify-between">
                <span class="text-[15px] text-slate-900">Alamat email</span>
                <span id="f-email" class="text-[15px] text-slate-500 truncate max-w-[50%]">…</span>
            </div>
            <p class="text-[12px] text-slate-500 mt-3 leading-relaxed">Pembaruan email dapat dilakukan melalui menu Pengaturan Keamanan pada akun utama Clincoo.</p>
        </div>
    </main>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm font-medium px-4 py-2.5 rounded-full shadow-lg z-50 opacity-0 transition-opacity duration-300 pointer-events-none max-w-[90vw] text-center"></div>

    <script src="assets/demo.js"></script>
    <script>
        var API = '/api';
        if (location.hostname.indexOf('github.io') !== -1) API = 'https://clincoo-komunitas.pages.dev/api';
        
        function safeRedirect(url) {
            try {
                if (location.protocol === 'blob:' || location.href.indexOf('usercontent.goog') !== -1 || !location.hostname) {
                    console.warn('Redirect dilewati:', url);
                    return;
                }
                location.replace(url);
            } catch (e) {
                console.warn('Kesalahan navigasi:', e);
            }
        }

        function token() { try { return localStorage.getItem('clincoo_auth_token') || localStorage.getItem('clincoo_token') || ''; } catch (e) { return ''; } }
        
        function api(path, opts) {
            if (window.DemoApi && !token()) return window.DemoApi(path, opts);
            opts = opts || {};
            opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
            var tk = token(); if (tk) opts.headers['Authorization'] = 'Bearer ' + tk;
            return fetch(API + path, opts).then(function (r) {
                return r.json().catch(function () { return {}; }).then(function (d) { d._status = r.status; return d; });
            }).catch(function() {
                // Mocking data untuk preview agar dapat diujicoba tanpa Backend
                if (path === '/auth/me') return { user: { id: '991', name: 'Dr. Anita Wijaya', email: 'anita.wijaya@example.com' } };
                if (path.indexOf('/community') === 0) return {
                    me: { bio: 'Praktisi Kesehatan & Edukator Komunitas Clincoo 🩺\nMembagikan tips sehat.', link: 'https://clincoo.id' }
                };
                return { success: true };
            });
        }

        function toast(msg) {
            var t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg; t.classList.remove('opacity-0');
            clearTimeout(t._tm); t._tm = setTimeout(function () { t.classList.add('opacity-0'); }, 2200);
        }

        var me = { name: '', bio: '', link: '', avatar: '' };

        function setAvatar(src) {
            var img = document.getElementById('ava-img');
            var ini = document.getElementById('ava-initial');
            if (src) {
                img.src = src; img.classList.remove('hidden');
                ini.classList.add('hidden');
            }
        }

        function init() {
            api('/auth/me').then(function (d) {
                if (d && d._status === 401) { safeRedirect('login.html'); return; }
                if (d && d.user) {
                    me.name = d.user.name || '';
                    me.avatar = d.user.avatar_url || '';
                    if (d.user.email) document.getElementById('f-email').textContent = d.user.email;
                    setAvatar(me.avatar);
                    document.getElementById('ava-initial').textContent = (me.name || 'S').charAt(0).toUpperCase();
                }
                document.getElementById('f-name').value = me.name;
                if (me.avatar) setAvatar(me.avatar);
            }).catch(function () { toast('Koneksi bermasalah'); });
            
            api('/community?limit=1').then(function (d) {
                if (d && d.me) {
                    me.bio = d.me.bio || ''; me.link = d.me.link || '';
                    if (d.me.name && !me.name) { me.name = d.me.name; document.getElementById('f-name').value = me.name; }
                    if (d.me.avatar_url) { me.avatar = d.me.avatar_url; setAvatar(me.avatar); }
                    document.getElementById('f-bio').value = me.bio;
                    document.getElementById('bio-count').textContent = me.bio.length;
                    document.getElementById('f-link').value = me.link;
                }
            }).catch(function () {});
            
            document.getElementById('f-bio').addEventListener('input', function () {
                document.getElementById('bio-count').textContent = this.value.length;
            });
        }

        function handleAvaFile(input) {
            var file = input.files && input.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function (e) {
                var img = new Image();
                img.onload = function () {
                    var q = 0.9, out = e.target.result;
                    var c = document.createElement('canvas');
                    var size = 256, w = img.width, h = img.height, s = Math.min(w, h);
                    c.width = size; c.height = size;
                    c.getContext('2d').drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, size, size);
                    while (q >= 0.4) { out = c.toDataURL('image/jpeg', q); if (out.length <= 100000) break; q -= 0.15; }
                    me.newAvatar = out;
                    setAvatar(out);
                    toast('Foto siap disimpan');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function saveProfile() {
            var name = document.getElementById('f-name').value.trim();
            var bio = document.getElementById('f-bio').value.trim().slice(0, 200);
            var link = document.getElementById('f-link').value.trim().slice(0, 120);
            if (!name) { toast('Nama tidak boleh kosong'); return; }
            
            var btn = document.getElementById('save-btn');
            btn.disabled = true; btn.textContent = '...';
            
            var body = { name: name, bio: bio, link: link };
            if (me.newAvatar) body.avatar = me.newAvatar;
            
            api('/community/profile', { method: 'POST', body: JSON.stringify(body) }).then(function (d) {
                btn.disabled = false; btn.textContent = 'Simpan';
                if (d._status === 401) { safeRedirect('login.html'); return; }
                if (d._status && !d.success) { toast(d.error || 'Gagal menyimpan'); return; }
                try {
                    localStorage.setItem('clincoo_community_me', JSON.stringify({
                        name: name, bio: bio, link: link,
                        avatar: d.me ? d.me.avatar_url : (me.avatar || ''),
                        ts: Date.now()
                    }));
                } catch (e) {}
                toast('Profil tersimpan ✨');
                setTimeout(function () { safeRedirect('akun.html'); }, 700);
            }).catch(function () { 
                btn.disabled = false; btn.textContent = 'Simpan'; 
                toast('Tersimpan secara lokal (Mode Preview)'); 
            });
        }

        init();
    </script>
</body>
</html>
