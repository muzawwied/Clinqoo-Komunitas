<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pengaturan & Privasi — Komunitas Clincoo</title>
    <meta name="description" content="Pengaturan notifikasi, data, dan privasi Komunitas Clincoo.">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .ic { width: 1.25em; height: 1.25em; display: inline-block; vertical-align: middle; flex-shrink: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-white min-h-screen text-slate-900 antialiased selection:bg-slate-200 selection:text-slate-900">

    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-sm border-b border-slate-200 px-4 py-3 transition-all">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <a href="akun.html" class="flex items-center text-slate-900 hover:opacity-70 transition-opacity w-8">
                <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </a>
            <h1 class="text-[15px] font-bold text-slate-900 tracking-tight">Pengaturan & Privasi</h1>
            <div class="w-8"></div>
        </div>
    </header>

    <main class="max-w-md mx-auto pt-4 pb-24">
        <section class="px-4 pb-3">
            <p class="text-[13px] text-slate-500">Atur notifikasi dan data kamu di perangkat ini.</p>
        </section>

        <div class="h-px w-full bg-slate-200 my-1"></div>

        <section class="px-4 py-4">
            <div class="flex items-center gap-2 mb-1">
                <svg class="ic text-slate-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                <h2 class="text-[15px] font-semibold text-slate-900">Notifikasi</h2>
            </div>
            <p class="text-[12px] text-slate-400 mb-3">Pilih interaksi yang muncul di lonceng beranda.</p>
            <div id="prefs" class="flex flex-col"></div>
        </section>

        <div class="h-px w-full bg-slate-200 my-1"></div>

        <section class="flex flex-col">
            <div class="px-4 py-2.5 bg-slate-50 border-y border-slate-100">
                <h2 class="text-[13px] font-semibold text-slate-600 uppercase tracking-wider">Data kamu</h2>
            </div>
            <button onclick="clrDraft()" class="w-full text-left px-4 py-3.5 flex justify-between items-center bg-white hover:bg-slate-50 active:bg-slate-100 transition-colors">
                <div class="flex items-center gap-3.5">
                    <svg class="ic text-slate-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
                    <span class="text-[15px] text-slate-900">Hapus draf postingan</span>
                </div>
                <svg class="ic w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
            <button onclick="clrSaved()" class="w-full text-left px-4 py-3.5 flex justify-between items-center bg-white hover:bg-slate-50 active:bg-slate-100 transition-colors">
                <div class="flex items-center gap-3.5">
                    <svg class="ic text-slate-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
                    <span class="text-[15px] text-slate-900">Hapus semua Tersimpan</span>
                </div>
                <svg class="ic w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
            <button onclick="clrSearch()" class="w-full text-left px-4 py-3.5 flex justify-between items-center bg-white hover:bg-slate-50 active:bg-slate-100 transition-colors">
                <div class="flex items-center gap-3.5">
                    <svg class="ic text-slate-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <span class="text-[15px] text-slate-900">Hapus riwayat pencarian</span>
                </div>
                <svg class="ic w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
        </section>

        <div class="h-px w-full bg-slate-200 my-1"></div>

        <section class="px-4 py-5">
            <div class="flex items-center gap-2 mb-3">
                <svg class="ic text-slate-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
                <h2 class="text-[15px] font-semibold text-slate-900">Sesi & keamanan</h2>
            </div>
            <button onclick="logoutNow()" class="w-full text-left px-4 py-3.5 flex items-center gap-3.5 bg-white border border-slate-200 rounded-xl hover:bg-red-50 active:bg-red-100 transition-colors">
                <svg class="ic text-red-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
                <span class="text-[15px] text-red-500 font-medium">Keluar dari akun ini</span>
            </button>
            <p class="text-[12px] text-slate-400 mt-3 leading-relaxed">Keluar menghapus sesi login di perangkat ini. Foto, postingan, dan profilmu tetap tersimpan.</p>
        </section>

        <p class="text-center text-[12px] text-slate-400 mt-4 mb-8">Komunitas Clincoo · <a href="bantuan.html" class="text-blue-600 font-medium">Pusat Bantuan</a></p>
    </main>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-xl z-50 opacity-0 transition-opacity duration-300 pointer-events-none max-w-[90vw] text-center"></div>

    <script src="assets/demo.js"></script>
    <script>
        var API = '/api';
        if (location.hostname.indexOf('github.io') !== -1) API = 'https://clincoo-komunitas.pages.dev/api';

        function safeRedirect(url) {
            try {
                if (location.protocol === 'blob:' || location.href.indexOf('usercontent.goog') !== -1 || !location.hostname) {
                    console.warn('Redirect dilewati:', url); return;
                }
                location.replace(url);
            } catch (e) { console.warn(e); }
        }

        function token() {
            try {
                return localStorage.getItem('clincoo_auth_token') || localStorage.getItem('clincoo_token')
                    || localStorage.getItem('clinqoo_auth_token') || localStorage.getItem('clinqoo_token') || '';
            } catch (e) { return ''; }
        }

        function api(path, opts) {
            if (window.DemoApi && !token()) return window.DemoApi(path, opts);
            opts = opts || {};
            opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
            var tk = token(); if (tk) opts.headers['Authorization'] = 'Bearer ' + tk;
            return fetch(API + path, opts).then(function (r) {
                return r.json().catch(function () { return {}; }).then(function (d) { d._status = r.status; return d; });
            });
        }

        function toast(msg) {
            var t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg; t.classList.remove('opacity-0');
            clearTimeout(t._tm); t._tm = setTimeout(function () { t.classList.add('opacity-0'); }, 2200);
        }

        var PH2SVG = {
            'ph-heart': '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
            'ph-chat-circle': '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
            'ph-at': '<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>'
        };
        var PREF_LABELS = {
            like: { icon: 'ph-heart', label: 'Suka di postinganmu', desc: 'Saat orang lain menyukai postinganmu' },
            comment: { icon: 'ph-chat-circle', label: 'Komentar baru', desc: 'Saat orang lain membalas postinganmu' },
            mention: { icon: 'ph-at', label: 'Penyebutan & tag', desc: 'Saat kamu atau tagmu disebut di postingan' }
        };

        function loadPrefs() {
            try { return JSON.parse(localStorage.getItem('clincoo_prefs') || localStorage.getItem('clinqoo_prefs') || '{}'); }
            catch (e) { return {}; }
        }
        function savePrefs(p) {
            try {
                localStorage.setItem('clincoo_prefs', JSON.stringify(p));
                localStorage.setItem('clinqoo_prefs', JSON.stringify(p));
            } catch (e) {}
        }

        function init() {
            var p = loadPrefs();
            ['like', 'comment', 'mention'].forEach(function (k) { if (p[k] === undefined) p[k] = true; });
            var box = document.getElementById('prefs');
            box.innerHTML = Object.keys(PREF_LABELS).map(function (k) {
                var m = PREF_LABELS[k];
                var on = !!p[k];
                return '<div class="flex items-center justify-between py-3.5 border-b border-slate-100 last:border-0">'
                    + '<div class="flex items-center gap-3 min-w-0 pr-3">'
                    + '<svg class="ic text-slate-700 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">' + (PH2SVG[m.icon] || '') + '</svg>'
                    + '<div><p class="text-[15px] text-slate-900 leading-snug">' + m.label + '</p>'
                    + '<p class="text-[12px] text-slate-400 mt-0.5">' + m.desc + '</p></div></div>'
                    + '<button onclick="togglePref(\'' + k + '\')" class="w-11 h-6 rounded-full transition-colors relative flex-shrink-0 ' + (on ? 'bg-slate-900' : 'bg-slate-200') + '">'
                    + '<span class="absolute top-0.5 w-5 h-5 bg-white rounded-full shadow transition-all ' + (on ? 'right-0.5' : 'left-0.5') + '"></span></button>'
                    + '</div>';
            }).join('');
            savePrefs(p);
        }

        function togglePref(k) {
            var p = loadPrefs();
            p[k] = !p[k];
            savePrefs(p);
            init();
            toast(PREF_LABELS[k].label + (p[k] ? ' diaktifkan' : ' dimatikan'));
        }

        function clrDraft() {
            try { localStorage.removeItem('clincoo_draft'); localStorage.removeItem('clinqoo_draft'); } catch (e) {}
            toast('Draf postingan dihapus');
        }
        function clrSaved() {
            if (!confirm('Hapus semua postingan tersimpan? Tindakan ini tidak bisa dibatalkan.')) return;
            try {
                localStorage.setItem('clincoo_saved', '[]');
                localStorage.setItem('clinqoo_saved', '[]');
            } catch (e) {}
            toast('Semua Tersimpan dihapus');
        }
        function clrSearch() {
            try { localStorage.removeItem('clincoo_last_search'); localStorage.removeItem('clinqoo_last_search'); } catch (e) {}
            toast('Riwayat pencarian dihapus');
        }

        function logoutNow() {
            api('/auth/logout', { method: 'POST' }).catch(function () {});
            try {
                ['clincoo_auth_token','clincoo_token','clincoo_community_me','clinqoo_auth_token','clinqoo_token','clinqoo_community_me']
                    .forEach(function (k) { localStorage.removeItem(k); });
            } catch (e) {}
            safeRedirect('login.html');
        }

        function guard() {
            if (!token() && !window.DemoApi) {
                if (location.protocol === 'blob:' || location.href.indexOf('usercontent.goog') !== -1) return true;
                safeRedirect('login.html'); return false;
            }
            return true;
        }

        if (guard()) init();
    </script>
</body>
</html>
