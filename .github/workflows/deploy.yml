# Deploy mandiri Komunitas Clincoo (Cloudflare Pages, project: clincoo-komunitas)
# Aktif otomatis begitu secret CLOUDFLARE_API_TOKEN ditambahkan ke repo ini
# (Settings → Secrets and variables → Actions → New repository secret).
# Sebelum secret itu ada, deploy bootstrap dilakukan dari repo Clincoo.
name: Deploy Komunitas (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy-clincoo-komunitas
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang wrangler
        run: npm install -g wrangler

      - name: Buat project Pages bila belum ada
        run: npx wrangler pages project create clincoo-komunitas --production-branch=main || true

      - name: Deploy ke Cloudflare Pages
        run: npx wrangler pages deploy . --project-name=clincoo-komunitas --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
