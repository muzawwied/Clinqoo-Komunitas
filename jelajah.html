<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jelajah — Komunitas Clincoo</title>
    <meta name="description" content="Jelajah tag trending dan kontributor aktif di Komunitas Clincoo.">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .ic { width: 1.25em; height: 1.25em; display: inline-block; vertical-align: middle; flex-shrink: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-white min-h-screen text-slate-900 antialiased selection:bg-slate-200 selection:text-slate-900">
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-sm border-b border-slate-200 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center text-slate-900 hover:opacity-70 w-8">
                <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </a>
            <h1 class="text-[15px] font-bold tracking-tight">Jelajah</h1>
            <div class="w-8"></div>
        </div>
    </header>
    <main class="max-w-md mx-auto pt-4 pb-24">
        <div class="px-4">
            <div class="relative">
                <svg class="ic absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input id="search-input" type="search" placeholder="Cari postingan atau orang…" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-3.5 py-3 text-[14px] focus:outline-none focus:ring-2 focus:ring-slate-900/10">
            </div>
        </div>
        <div id="search-results" class="hidden mt-3 px-4"></div>
        <div class="h-px w-full bg-slate-200 mt-5 mb-2"></div>
        <section class="px-4 py-3">
            <h2 class="text-[13px] font-semibold text-slate-600 uppercase tracking-wider mb-3">Tren tag</h2>
            <div id="trend-cards" class="flex flex-wrap gap-2"><span class="text-[13px] text-slate-400">Memuat…</span></div>
        </section>
        <div class="h-px w-full bg-slate-200 my-2"></div>
        <section class="px-4 py-3">
            <h2 class="text-[13px] font-semibold text-slate-600 uppercase tracking-wider mb-3">Kontributor aktif</h2>
            <div id="people" class="flex flex-col"><span class="text-[13px] text-slate-400">Memuat…</span></div>
        </section>
        <div class="h-px w-full bg-slate-200 my-2"></div>
        <section class="px-4 py-5">
            <h2 class="text-[15px] font-semibold mb-2">Tentang komunitas</h2>
            <p class="text-[13px] text-slate-500 leading-relaxed">Ruang ngumpul para pengguna Clincoo — bagikan progres, tanya jawab, dan kenalan.</p>
        </section>
    </main>
    <nav class="fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-sm border-t border-slate-200">
        <div class="max-w-md mx-auto flex items-center justify-around py-2 pb-[max(0.5rem,env(safe-area-inset-bottom))]">
            <a href="index.html" class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400"><svg class="ic w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="text-[10px] font-medium">Beranda</span></a>
            <a href="jelajah.html" class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-900"><svg class="ic w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span class="text-[10px] font-medium">Jelajah</span></a>
            <a href="posting.html" class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400"><svg class="ic w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg><span class="text-[10px] font-medium">Posting</span></a>
            <a href="akun.html" class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400"><svg class="ic w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="text-[10px] font-medium">Profil</span></a>
        </div>
    </nav>
    <script src="assets/demo.js"></script>
    <script>
        var API='/api';
        if(location.hostname.indexOf('github.io')!==-1) API='https://clincoo-komunitas.pages.dev/api';
        function token(){try{return localStorage.getItem('clincoo_auth_token')||localStorage.getItem('clincoo_token')||localStorage.getItem('clinqoo_auth_token')||localStorage.getItem('clinqoo_token')||'';}catch(e){return'';}}
        function api(path,opts){if(window.DemoApi&&!token())return window.DemoApi(path,opts);opts=opts||{};opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});var tk=token();if(tk)opts.headers['Authorization']='Bearer '+tk;return fetch(API+path,opts).then(function(r){return r.json().catch(function(){return{};}).then(function(d){d._status=r.status;return d;});}).catch(function(){if(path.indexOf('/community')===0)return{feed:[{author:'Dr. Anita',content:'Tips sehat #kesehatan #tips',likes:20},{author:'Budi',content:'Progres #web #tips',likes:12},{author:'Sari',content:'Nutrisi #nutrisi #sehat',likes:8}]};return{};});}
        function esc(t){return String(t||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
        function init(){
            api('/community?limit=100').then(function(d){
                var feed=d.feed||[],tags={},people={},orderT=[],orderP=[];
                feed.forEach(function(p){(String(p.content||p.text||'').match(/#[\w]+/g)||[]).forEach(function(t){if(!tags[t])orderT.push(t);tags[t]=(tags[t]||0)+1;});var a=p.author||'User';if(!people[a]){orderP.push(a);people[a]={name:a,posts:0,likes:0,avatar:p.author_avatar};}people[a].posts++;people[a].likes+=(p.likes||0);});
                orderT.sort(function(a,b){return tags[b]-tags[a];});orderP.sort(function(a,b){return people[b].posts-people[a].posts;});
                var tc=document.getElementById('trend-cards');
                tc.innerHTML=!orderT.length?'<span class="text-[13px] text-slate-400">Belum ada tag.</span>':orderT.slice(0,12).map(function(t){return '<button onclick="document.getElementById(\'search-input\').value=\''+esc(t)+'\';document.getElementById(\'search-input\').dispatchEvent(new Event(\'input\'))" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-100 hover:bg-slate-200 text-[13px] font-medium text-slate-800">'+esc(t)+'<span class="text-slate-400 text-[11px]">'+tags[t]+'</span></button>';}).join('');
                var pe=document.getElementById('people');
                pe.innerHTML=!orderP.length?'<span class="text-[13px] text-slate-400">Belum ada data.</span>':orderP.slice(0,8).map(function(a){var u=people[a];var av=u.avatar?'<img src="'+esc(u.avatar)+'" class="w-full h-full object-cover" alt="">':(u.name||'U').charAt(0).toUpperCase();return '<div class="flex items-center gap-3 py-3 border-b border-slate-100 last:border-0"><div class="w-10 h-10 rounded-full bg-slate-200 overflow-hidden flex items-center justify-center text-sm font-medium text-slate-600">'+av+'</div><div class="flex-1 min-w-0"><p class="text-[14px] font-semibold truncate">'+esc(u.name)+'</p><p class="text-[12px] text-slate-400">'+u.posts+' postingan · '+u.likes+' suka</p></div></div>';}).join('');
            });
            document.getElementById('search-input').addEventListener('input',function(){
                var q=this.value.trim().toLowerCase(),box=document.getElementById('search-results');
                if(!q){box.classList.add('hidden');box.innerHTML='';return;}
                api('/community?limit=50').then(function(d){
                    var hits=(d.feed||[]).filter(function(p){var t=((p.content||p.text||'')+' '+(p.author||'')).toLowerCase();return t.indexOf(q)!==-1;}).slice(0,10);
                    box.classList.remove('hidden');
                    box.innerHTML=!hits.length?'<p class="text-[13px] text-slate-500 py-4 text-center">Tidak ada hasil.</p>':hits.map(function(p){var txt=esc((p.content||p.text||'').slice(0,120));return '<div class="py-3 border-b border-slate-100"><p class="text-[13px] font-semibold">'+esc(p.author||'User')+'</p><p class="text-[13px] text-slate-600 mt-0.5">'+txt+(txt.length>=120?'…':'')+'</p></div>';}).join('');
                });
            });
        }
        init();
    </script>
</body>
</html>
